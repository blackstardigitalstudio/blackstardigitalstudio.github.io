name: Instagram - due reel al giorno

# I reel hanno la voce di Matteo, che si genera solo sul suo computer:
# qui non si genera niente, si pesca dalla coda gia' pronta e si pubblica.
#
# DUE reel al giorno, deciso sui dati del 15/08/2026: un reel raggiunge in
# media 19 persone, un post 3. I reel escono dal giro dei follower, i post no.
#
# GLI ORARI SONO IN PROVA. Non li abbiamo scelti coi dati (non ne avevamo):
# ogni fascia viene provata a rotazione, un giorno su tre, cosi' dopo qualche
# settimana si vede quale rende davvero. Lo script controlla se e' il suo turno.
#
#   primo reel:    08:00 · 13:00 · 17:00  (ora italiana)
#   secondo reel:  19:00 · 21:00 · 23:00
#
# Gli orari in UTC sono due ore indietro (ora legale) e mai sull'ora tonda,
# perche' l'orologio di GitHub ritarda quando c'e' traffico.
on:
  schedule:
    - cron: '7 6 * * *'      # 08:07 IT  -> turno 0
    - cron: '7 11 * * *'     # 13:07 IT  -> turno 1
    - cron: '7 15 * * *'     # 17:07 IT  -> turno 2
    - cron: '23 17 * * *'    # 19:23 IT  -> turno 0, secondo
    - cron: '23 19 * * *'    # 21:23 IT  -> turno 1, secondo
    - cron: '23 21 * * *'    # 23:23 IT  -> turno 2, secondo
  workflow_dispatch:
    inputs:
      prova:
        description: 'Solo prova (controlla tutto ma NON pubblica)'
        type: boolean
        default: true

concurrency:
  group: instagram-reel
  cancel-in-progress: false

permissions:
  issues: write
  contents: write

jobs:
  pubblica-reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capisci quale fascia e' questa
        id: fascia
        run: |
          ORA="${{ github.event.schedule }}"
          case "$ORA" in
            "7 6 * * *")   echo "turno=0" >> $GITHUB_OUTPUT; echo "secondo=" >> $GITHUB_OUTPUT ;;
            "7 11 * * *")  echo "turno=1" >> $GITHUB_OUTPUT; echo "secondo=" >> $GITHUB_OUTPUT ;;
            "7 15 * * *")  echo "turno=2" >> $GITHUB_OUTPUT; echo "secondo=" >> $GITHUB_OUTPUT ;;
            "23 17 * * *") echo "turno=0" >> $GITHUB_OUTPUT; echo "secondo=--secondo" >> $GITHUB_OUTPUT ;;
            "23 19 * * *") echo "turno=1" >> $GITHUB_OUTPUT; echo "secondo=--secondo" >> $GITHUB_OUTPUT ;;
            "23 21 * * *") echo "turno=2" >> $GITHUB_OUTPUT; echo "secondo=--secondo" >> $GITHUB_OUTPUT ;;
            *)             echo "turno=" >> $GITHUB_OUTPUT; echo "secondo=" >> $GITHUB_OUTPUT ;;
          esac

      - name: Quanti reel ci sono in coda
        id: coda
        working-directory: automazione
        run: |
          n=$(ls pronti-reel/*.mp4 2>/dev/null | wc -l)
          echo "quanti=$n" >> $GITHUB_OUTPUT
          echo "In coda: $n reel"

      - name: Pubblica il prossimo reel
        if: steps.coda.outputs.quanti != '0'
        working-directory: automazione
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TURNO=""
          if [ -n "${{ steps.fascia.outputs.turno }}" ]; then
            TURNO="--turno ${{ steps.fascia.outputs.turno }}"
          fi
          python pubblica.py --reel --se-serve $TURNO ${{ steps.fascia.outputs.secondo }} ${{ inputs.prova && '--prova' || '' }}

      - name: Avvisa se la coda sta finendo
        if: steps.coda.outputs.quanti == '4'
        uses: actions/github-script@v7
        with:
          script: |
            const titolo = 'La coda dei reel sta finendo';
            const aperte = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'instagram'
            });
            if (aperte.data.some(i => i.title === titolo)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titolo, labels: ['instagram'],
              body: [
                'Restano quattro reel: con due al giorno finiscono in due giorni.',
                '',
                'Per rifare la scorta, sul computer di Matteo:',
                '```',
                'cd D:\\marketing\\03-CONTENUTI\\generatore',
                'voce\\venv-cb\\Scripts\\python.exe scorta_reel.py 30',
                '```',
                'poi caricare i file in `automazione/pronti-reel/`.'
              ].join('\n')
            });

      - name: Se la pubblicazione fallisce, lascia un avviso
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const oggi = new Date().toISOString().slice(0, 10);
            const titolo = `Un reel del ${oggi} non e' uscito`;
            const aperte = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'instagram'
            });
            if (aperte.data.some(i => i.title === titolo)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titolo, labels: ['instagram'],
              body: `La pubblicazione non e' riuscita.\n\nDettaglio: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Segna cosa e' uscito
        if: always()
        run: |
          git config user.name "blackstar-bot"
          git config user.email "blackstardigitalstudio@gmail.com"
          git add -A automazione/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Niente da salvare."
          else
            git commit -m "reel del giorno [skip ci]"
            git pull --rebase --autostash -q
            git push
          fi
