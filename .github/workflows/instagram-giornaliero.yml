name: Instagram - un post al giorno

# Gira nel cloud di GitHub: il computer di Matteo puo' restare spento.
#
# L'orologio di GitHub non e' puntuale: quando c'e' traffico ritarda o salta,
# soprattutto alle ore tonde. Percio':
#   1) evitiamo i minuti :00, che sono i piu' affollati;
#   2) ci proviamo TRE volte a distanza di un'ora e mezza;
#   3) prima di pubblicare si chiede a Instagram se un post di oggi c'e' gia'.
# Cosi' esce sempre e sola una volta, anche se i primi tentativi saltano.
#
# 19:07 UTC = 20:07 a Las Palmas, 21:07 in Italia e Spagna.
on:
  schedule:
    - cron: '7 19 * * *'
    - cron: '37 20 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:        # per lanciarlo a mano quando serve
    inputs:
      prova:
        description: 'Solo prova (controlla tutto ma NON pubblica)'
        type: boolean
        default: true

concurrency:
  group: instagram-giornaliero
  cancel-in-progress: false

permissions:
  issues: write
  contents: write           # per salvare l'immagine e il registro nel repo

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa il necessario
        run: pip install --quiet pillow

      - name: Prepara il contenuto del giorno
        working-directory: automazione
        run: python genera.py 1

      - name: Pubblica su Instagram
        working-directory: automazione
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python pubblica.py --se-serve ${{ inputs.prova && '--prova' || '' }}

      - name: Se qualcosa si rompe, lascia un avviso
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const oggi = new Date().toISOString().slice(0, 10);
            const titolo = `Il post Instagram del ${oggi} non e' uscito`;
            const aperte = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'instagram'
            });
            if (aperte.data.some(i => i.title === titolo)) return;   // non ripetere l'avviso
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titolo,
              labels: ['instagram'],
              body: [
                `La pubblicazione automatica di oggi non e' riuscita.`,
                ``,
                `**Cosa guardare, in ordine:**`,
                `1. Il token Instagram e' scaduto o e' stato revocato? (dura 60 giorni)`,
                `2. Sono finite le curiosita' da pubblicare?`,
                `3. Instagram ha cambiato qualcosa nelle sue regole?`,
                ``,
                `Dettaglio dell'errore: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `_Nota: ci sono altri due tentativi piu' tardi oggi. Se rientrano, questo avviso si puo' chiudere._`
              ].join('\n')
            });

      - name: Segna cosa e' uscito
        run: |
          git config user.name "blackstar-bot"
          git config user.email "blackstardigitalstudio@gmail.com"
          git add automazione/storico.json automazione/registro-pubblicazioni.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Niente da salvare."
          else
            git commit -m "post del giorno [skip ci]"
            git pull --rebase --autostash -q
            git push
          fi
